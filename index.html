<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="tr" lang="tr">

<head>
	<title>drAW2D | mADEMatik</title>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
	<meta name="keywords" content="Graph, functions, axis, javascript, canvas, drAW2D, drAW3D">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="made by mADEMatik">
	<meta name="author" content="made by mADEMatik">
	<link rel="shortcut icon" href="img/favicon.svg" />
	<!-- Stiller ilk çizimden önce yüklenir; JavaScript'ten eklenince simgeler bir an doğal boyutlarında görünür. -->
	<link rel="stylesheet" href="/src/styles/toolbar.css" />
	<link rel="stylesheet" href="/src/styles/styles.css" />
	<link rel="stylesheet" href="/src/styles/titlebar.css" />


</head>

<body>
	<div id="centerWrapper">
		<canvas id="canvas"></canvas>
		<div id="mainToolbar" class="main-toolbar" role="toolbar" aria-label="Araçlar" data-action="select">
			<button id="currentTool" class="toolbar-button current-tool" type="button" title="Araçlar"></button>
			<div id="toolGroups" class="tool-groups"></div>
			<div class="toolbar-actions">
				<button type="button" id="fileMenuButton" class="toolbar-button" title="Dosya">
					<img src="./img/file.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="undo" class="toolbar-button" title="Geri Al">
					<img src="./img/toogle.svg" width="26" height="26" alt="" style="transform:rotateX(180deg) rotate(30deg)">
				</button>
				<button type="button" id="redo" class="toolbar-button" title="Yinele">
					<img src="./img/toogle.svg" width="26" height="26" alt="" style="transform:rotate(210deg)">
				</button>
				<button type="button" id="clear" class="toolbar-button" title="Temizle">
					<img src="./img/clear.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="btnStandartWiew" class="toolbar-button" title="Standart Görünüm">
					<img src="./img/default.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="helpMenuButton" class="toolbar-button" title="Yardım">
					<img id="btnimgHelpMenu" src="./img/help.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="btnCalc" class="toolbar-button" title="Paneli Gizle">
					<img id="btnimgCalc" src="./img/arrow.svg" width="26" height="26" alt="">
				</button>
			</div>
		</div>
		<div class="rightWrapper" id="rightWrapper">
			<div class="reSizer"></div>
			<!-- Narrow screens: the sheet switches between objects and tools. -->
			<div class="panel-tabs" role="tablist" aria-label="Panel">
				<button type="button" id="tabAlgebra" class="panel-tab" role="tab" aria-selected="true" aria-controls="scrollWrapper">Cebir</button>
				<button type="button" id="tabTools" class="panel-tab" role="tab" aria-selected="false" aria-controls="toolsPanel">Araçlar</button>
			</div>
			<div id="toolsPanel" class="tools-panel" role="tabpanel" hidden></div>
			<div id="scrollWrapper">
				<div class="expr-block-giris">
					<input id="giris" placeholder="Giriş" title="Giriş" value="">
					<button type="button" id="keyboardToggle" class="keyboard-toggle" title="Matematik klavyesi" aria-pressed="false"
						aria-controls="mathKeyboard"><img src="./img/keyboard.svg" width="20" height="20" alt=""></button>
				</div>
				<hr>
				<div id="objectsContainer"></div>
			</div>
		</div>
	</div>
	<!-- Toast Message -->
	<div id="snackbar" class="tool-toast" role="status" aria-live="polite">
		<strong id="snackTitle" class="tool-toast-title">Nokta</strong>
		<span id="snackContent" class="tool-toast-message">Konum seçin</span>
	</div>
	<!-- Yardım Penceresi -->
	<div class="help-popup" id="help-popup">
		<div class="help-content">
			<div id="help-header">
				<h2>drAW2D Yardım</h2>
				<button class="help-close">&times;</button>
			</div>

			<div class="help-section">
				<h3>Giriş Alanı Komutları</h3>
				<!-- Konular ve örnekler src/commands/language.ts tablosundan üretilir. -->
			</div>
		</div>
	</div>
	<!-- Yardım Penceresi Son -->
	<script type="module" src="/src/main.ts"></script>
</body>

</html>
